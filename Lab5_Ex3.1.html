<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Infographic và video YouTube được tổng hợp trên cùng một trang.">
	<title>Infographic &amp; Video</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #18333a;
			--muted: #587078;
			--paper: #f4f7f2;
			--surface: #ffffff;
			--accent: #d14e36;
			--line: #d9e3dc;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			background: var(--paper);
			color: var(--ink);
			font-family: "Segoe UI", Tahoma, sans-serif;
		}

		.page {
			width: min(1080px, calc(100% - 40px));
			margin: 0 auto;
		}

		header {
			padding: 56px 0 34px;
			border-bottom: 1px solid var(--line);
		}

		.eyebrow {
			margin: 0 0 12px;
			color: var(--accent);
			font-size: 0.78rem;
			font-weight: 700;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 720px;
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(2.25rem, 6vw, 4rem);
			font-weight: 500;
			line-height: 1.08;
		}

		.intro {
			max-width: 620px;
			margin: 16px 0 0;
			color: var(--muted);
			font-size: 1.05rem;
			line-height: 1.7;
		}

		main { padding: 34px 0 52px; }

		.content-section + .content-section { margin-top: 42px; }

		.section-heading {
			display: flex;
			align-items: baseline;
			gap: 12px;
			margin-bottom: 16px;
		}

		.section-number {
			color: var(--accent);
			font-size: 0.82rem;
			font-weight: 700;
		}

		h2 {
			margin: 0;
			font-family: Georgia, "Times New Roman", serif;
			font-size: 1.65rem;
			font-weight: 500;
		}

		.frame {
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: 6px;
			background: var(--surface);
			box-shadow: 0 12px 30px rgb(24 51 58 / 7%);
		}

		.infographic-frame {
			width: 100%;
			aspect-ratio: 16 / 10;
			min-height: 320px;
		}

		.video-frame {
			width: min(100%, 420px);
			aspect-ratio: 9 / 16;
			margin: 0 auto;
		}

		iframe {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
		}

		.fallback {
			margin: 12px 0 0;
			color: var(--muted);
			font-size: 0.92rem;
		}

		a { color: #176b68; }
		a:hover { color: var(--accent); }

		footer {
			padding: 20px 0 28px;
			border-top: 1px solid var(--line);
			color: var(--muted);
			font-size: 0.88rem;
		}

		@media (max-width: 600px) {
			.page { width: min(100% - 28px, 1080px); }
			header { padding-top: 38px; }
			.infographic-frame { min-height: 240px; }
		}
	</style>
</head>
<body>
	<div class="page">
		<header>
			<p class="eyebrow">Nội dung trực quan</p>
			<h1>Infographic &amp; Video</h1>
			<p class="intro">Khám phá nội dung qua infographic và video ngắn được tuyển chọn, trình bày gọn gàng trong cùng một trang.</p>
		</header>

		<main>
			<section class="content-section" aria-labelledby="infographic-title">
				<div class="section-heading">
					<span class="section-number">01</span>
					<h2 id="infographic-title">Infographic</h2>
				</div>
				<div class="frame infographic-frame">
					<iframe
						src="https://www.canva.com/design/DAHWL9Foqqo/view?embed"
						title="Infographic trên Canva"
						loading="lazy"
						allowfullscreen>
					</iframe>
				</div>
				<p class="fallback">Không xem được nội dung nhúng? <a href="https://canva.link/1r2nfg7md0d0tf7" target="_blank" rel="noopener noreferrer">Mở infographic trên Canva</a>.</p>
			</section>

			<section class="content-section" aria-labelledby="video-title">
				<div class="section-heading">
					<span class="section-number">02</span>
					<h2 id="video-title">Video YouTube</h2>
				</div>
				<div class="frame video-frame">
					<iframe
						src="https://www.youtube-nocookie.com/embed/xrVPaqrLD6w"
						title="Video YouTube Shorts"
						loading="lazy"
						allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
						referrerpolicy="strict-origin-when-cross-origin"
						allowfullscreen>
					</iframe>
				</div>
			</section>
		</main>

		<footer>Code được hỗ trợ bởi GitHub Copilot.</footer>
	</div>
</body>
</html>
